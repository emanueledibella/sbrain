name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: Full suite (Ollama + Neo4j)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_PROJECT_NAME: sbrain-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: compose.yaml:.github/compose.ci.yaml
      COMPOSE_PROFILES: test
      SB_CI_MODEL_CACHE: ${{ github.workspace }}/.runtime/ci/models
      SB_CI_RESULTS: ${{ github.workspace }}/.runtime/ci/results
      SB_MODEL_TIMEOUT: "300"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare disposable configuration
        run: |
          python3 scripts/init_env.py
          python3 - <<'PY'
          from pathlib import Path

          for line in Path(".env").read_text().splitlines():
              key, _, value = line.partition("=")
              if key in {"NEO4J_PASSWORD", "SB_MCP_WRITE_TOKEN", "SB_MCP_READ_TOKEN"}:
                  print(f"::add-mask::{value}")
          PY
          mkdir -p "$SB_CI_MODEL_CACHE" "$SB_CI_RESULTS"
          chmod 700 "$SB_CI_RESULTS"
          export SB_CI_UID="$(id -u)" SB_CI_GID="$(id -g)"
          echo "SB_CI_UID=$SB_CI_UID" >> "$GITHUB_ENV"
          echo "SB_CI_GID=$SB_CI_GID" >> "$GITHUB_ENV"
          docker compose version
          docker compose config --quiet

      - name: Cache Ollama model files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SB_CI_MODEL_CACHE }}
          key: sbrain-models-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('compose.yaml', '.github/compose.ci.yaml') }}

      - name: Build test image
        timeout-minutes: 10
        run: docker compose build tests

      - name: Lint Python
        run: docker compose run --rm --no-deps tests -m ruff check --no-cache src tests scripts

      - name: Start Neo4j and Ollama
        timeout-minutes: 5
        run: docker compose up -d --wait --wait-timeout 180 neo4j ollama

      - name: Download missing local models
        timeout-minutes: 10
        run: |
          if ! docker compose run --rm --no-deps models-init > "$SB_CI_RESULTS/models-init.log" 2>&1; then
            tail -n 60 "$SB_CI_RESULTS/models-init.log"
            exit 1
          fi

      - name: Run full suite including both worker recovery scenarios
        id: suite
        timeout-minutes: 20
        run: |
          docker compose run --rm --no-deps tests \
            -m pytest -q -p no:cacheprovider --strict-markers \
            --basetemp=/results/pytest --junitxml=/results/junit.xml \
            2>&1 | tee "$SB_CI_RESULTS/pytest.log"

      - name: Verify live coverage and write job summary
        if: ${{ !cancelled() && steps.suite.outcome != 'skipped' }}
        run: python3 scripts/ci_results.py "$SB_CI_RESULTS/junit.xml" --summary "$GITHUB_STEP_SUMMARY"

      - name: Collect service diagnostics
        if: always()
        run: |
          mkdir -p "$SB_CI_RESULTS"
          docker compose ps -a > "$SB_CI_RESULTS/compose-status.txt" 2>&1 || true
          docker compose logs --no-color --timestamps --tail=200 neo4j ollama \
            > "$SB_CI_RESULTS/services.log" 2>&1 || true

      - name: Upload test reports and diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ env.SB_CI_RESULTS }}/junit.xml
            ${{ env.SB_CI_RESULTS }}/pytest.log
            ${{ env.SB_CI_RESULTS }}/models-init.log
            ${{ env.SB_CI_RESULTS }}/compose-status.txt
            ${{ env.SB_CI_RESULTS }}/services.log
            ${{ env.SB_CI_RESULTS }}/pytest/**/recovery-report.json
            ${{ env.SB_CI_RESULTS }}/pytest/**/server-*.log
            ${{ env.SB_CI_RESULTS }}/pytest/**/worker-*.log

      - name: Remove disposable services and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
